<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Booking Automation</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f3, #dfe9f3);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 90%;
    max-width: 1000px;
    margin-top: 30px;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }

  h1 {
    text-align: center;
    color: #333;
  }

  .iframe-wrapper {
    width: 100%;
    height: 600px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #ddd;
    margin-top: 20px;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .section-title {
    margin-top: 30px;
    margin-bottom: 10px;
    text-align: center;
    color: #333;
  }

  .slider {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 10px;
    scroll-behavior: smooth;
  }

  .slider::-webkit-scrollbar {
    height: 8px;
  }

  .slider::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 10px;
  }

  .slider img {
    height: 140px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .slider img:hover {
    transform: scale(1.08);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  footer {
    margin-top: 20px;
    font-size: 14px;
    color: #777;
    text-align: center;
  }

</style>
</head>

<body>

<div class="container">
  <h1>🏨 Hotel Booking Dashboard</h1>

  <!-- Apps Script Form -->
  <div class="iframe-wrapper">
    <iframe src="https://script.google.com/macros/s/AKfycbzXsJUSd6FhNs1gKv5iqJRFmPlcpHRLKq8YfaeP_OuIrpLczlykiEl3Q0FdJyvaAKstRA/exec"></iframe>
  </div>

  <!-- Image Slider -->
  <h2 class="section-title">📸 Hotel Gallery</h2>

  <div class="slider">
    <img src="images/hotel1.jpg" loading="lazy">
    <img src="images/hotel2.jpg" loading="lazy">
    <img src="images/hotel3.jpg" loading="lazy">
    <img src="images/hotel4.jpg" loading="lazy">
    <img src="images/hotel5.jpg" loading="lazy">
    <img src="images/hotel6.jpg" loading="lazy">
    <img src="images/hotel7.jpg" loading="lazy">
    <img src="images/hotel8.jpg" loading="lazy">
    <img src="images/hotel9.jpg" loading="lazy">
    <img src="images/hotel10.jpg" loading="lazy">
    <img src="images/hotel11.jpg" loading="lazy">
    <img src="images/hotel12.jpg" loading="lazy">
    <img src="images/hotel13.jpg" loading="lazy">
    <img src="images/hotel14.jpg" loading="lazy">
    <img src="images/hotel15.jpg" loading="lazy">
    <img src="images/hotel16.jpg" loading="lazy">
    <img src="images/hotel17.jpg" loading="lazy">
    <img src="images/hotel18.jpg" loading="lazy">
    <img src="images/hotel19.jpg" loading="lazy">
    <img src="images/hotel20.jpg" loading="lazy">
  </div>
</div>

</body>
</html>
