<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Booking Automation</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f3, #dfe9f3);
  }

  .container {
    width: 95%;
    max-width: 900px;
    margin: 15px auto;
    background: #fff;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }

  h1 {
    text-align: center;
    color: #333;
  }

  .iframe-wrapper {
    width: 100%;
    height: 550px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #ddd;
    margin-top: 15px;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .section-title {
    margin: 20px 0 10px;
    text-align: center;
    color: #333;
  }

  /* 🔥 3 PER ROW GRID */
  .gallery-wrapper {
    width: 100%;
    padding: 0 10px 15px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .gallery-item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
  }

  .gallery-item img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.3s;
  }

  .gallery-item:hover img {
    transform: scale(1.05);
  }

  .caption {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    color: #fff;
    font-size: 14px;
    padding: 8px;
    text-align: center;
  }

  /* 📱 MOBILE → 2 PER ROW */
  @media (max-width: 600px) {
    .container {
      width: 100%;
      border-radius: 0;
      padding: 10px;
    }

    .gallery {
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .gallery-item img {
      height: 180px;
    }

    .iframe-wrapper {
      height: auto;
      min-height: 450px;
    }
  }

</style>
</head>

<body>

<div class="container">
  <h1>🏨 Hotel Booking Dashboard</h1>

  <!-- Booking Form -->
  <div class="iframe-wrapper">
    <iframe src="https://script.google.com/macros/s/AKfycbzXsJUSd6FhNs1gKv5iqJRFmPlcpHRLKq8YfaeP_OuIrpLczlykiEl3Q0FdJyvaAKstRA/exec"></iframe>
  </div>

  <h2 class="section-title">📸 Hotel Gallery</h2>
</div>

<!-- FULL WIDTH GALLERY -->
<div class="gallery-wrapper">

  <div class="gallery">

    <div class="gallery-item">
      <img src="images/hotel1.jpg" onclick="openImage(this)">
      <div class="caption">Hotel Entrance</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel2.jpg" onclick="openImage(this)">
      <div class="caption">Reception Area</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel3.jpg" onclick="openImage(this)">
      <div class="caption">Deluxe Room</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel4.jpg" onclick="openImage(this)">
      <div class="caption">Luxury Suite</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel5.jpg" onclick="openImage(this)">
      <div class="caption">Restaurant</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel6.jpg" onclick="openImage(this)">
      <div class="caption">Dining Area</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel7.jpg" onclick="openImage(this)">
      <div class="caption">Conference Hall</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel8.jpg" onclick="openImage(this)">
      <div class="caption">Lobby Lounge</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel9.jpg" onclick="openImage(this)">
      <div class="caption">Swimming Pool</div>
    </div>

  </div>
</div>

<!-- FULLSCREEN VIEW -->
<script>
function openImage(img) {
  const popup = document.createElement('div');
  popup.style = `
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
  `;

  const bigImg = document.createElement('img');
  bigImg.src = img.src;
  bigImg.style = "max-width:95%; max-height:95%; border-radius:10px;";

  popup.appendChild(bigImg);
  popup.onclick = () => popup.remove();

  document.body.appendChild(popup);
}
</script>

</body>
</html>
