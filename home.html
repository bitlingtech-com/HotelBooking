<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Booking </title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f3, #dfe9f3);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 95%;
    max-width: 1000px;
    margin-top: 20px;
    background: #fff;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }

  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 10px;
  }

  .iframe-wrapper {
    width: 100%;
    height: 600px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #ddd;
    margin-top: 15px;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .section-title {
    margin-top: 25px;
    margin-bottom: 10px;
    text-align: center;
    color: #333;
  }

  /* 🔥 NEW GRID GALLERY */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }

  .gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
  }

  .gallery-item img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .gallery-item:hover img {
    transform: scale(1.05);
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
  }

  /* Title overlay */
  .caption {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 13px;
    padding: 6px;
    text-align: center;
  }

  footer {
    margin-top: 15px;
    font-size: 14px;
    color: #777;
    text-align: center;
  }

  /* 📱 Mobile Optimization */
  @media (max-width: 600px) {
    .container {
      padding: 10px;
    }

    .gallery {
      grid-template-columns: repeat(2, 1fr);
    }

    .gallery-item img {
      height: 160px;
    }

    .iframe-wrapper {
      height: auto;
      min-height: 500px;
    }
  }

</style>
</head>

<body>

<div class="container">
  <h1>🏨 Hotel Booking Dashboard</h1>

  <!-- Booking Form -->
  <div class="iframe-wrapper">
    <iframe src="https://script.google.com/macros/s/AKfycbzXsJUSd6FhNs1gKv5iqJRFmPlcpHRLKq8YfaeP_OuIrpLczlykiEl3Q0FdJyvaAKstRA/exec"></iframe>
  </div>

  <!-- Gallery -->
  <h2 class="section-title">📸 Hotel Gallery</h2>

  <div class="gallery">

    <div class="gallery-item">
      <img src="images/hotel1.jpg" onclick="openImage(this)">
      <div class="caption">Hotel Entrance</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel2.jpg" onclick="openImage(this)">
      <div class="caption">Reception Area</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel3.jpg" onclick="openImage(this)">
      <div class="caption">Deluxe Room</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel4.jpg" onclick="openImage(this)">
      <div class="caption">Luxury Suite</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel5.jpg" onclick="openImage(this)">
      <div class="caption">Restaurant</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel6.jpg" onclick="openImage(this)">
      <div class="caption">Dining Area</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel7.jpg" onclick="openImage(this)">
      <div class="caption">Conference Hall</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel8.jpg" onclick="openImage(this)">
      <div class="caption">Lobby Lounge</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel9.jpg" onclick="openImage(this)">
      <div class="caption">Swimming Pool</div>
    </div>

    <div class="gallery-item">
      <img src="images/hotel10.jpg" onclick="openImage(this)">
      <div class="caption">Night View</div>
    </div>

  </div>

</div>

<!-- 🔍 Fullscreen Image Viewer -->
<script>
function openImage(img) {
  const popup = document.createElement('div');
  popup.style = `
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
  `;

  const bigImg = document.createElement('img');
  bigImg.src = img.src;
  bigImg.style = "max-width:90%; max-height:90%; border-radius:10px;";

  popup.appendChild(bigImg);
  popup.onclick = () => popup.remove();

  document.body.appendChild(popup);
}
</script>

</body>
</html>
